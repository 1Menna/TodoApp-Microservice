<div class="login-page">

  <div class="brand">
    <div class="brand-icon">
      <svg class="check" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-line"></div>
      <svg class="check" viewBox="0 0 24 24" fill="none">
        <path d="M5 13l4 4L19 7" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="brand-line"></div>
    </div>
    <span class="brand-name">Toda</span>
  </div>

  <div class="content">
    <h1 class="title">Login</h1>

    <form class="form" (ngSubmit)="onLogin()">
      <div class="field">
        <label for="email">Email</label>
        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input
            id="password"
            name="password"
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            autocomplete="current-password"
            required
          />
          <button
            type="button"
            class="toggle-visibility"
            (click)="togglePasswordVisibility()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
          >
            <svg *ngIf="!showPassword" viewBox="0 0 24 24" fill="none" width="22" height="22">
              <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z" stroke="#5a5a5a" stroke-width="2"/>
              <circle cx="12" cy="12" r="3" stroke="#5a5a5a" stroke-width="2"/>
            </svg>
            <svg *ngIf="showPassword" viewBox="0 0 24 24" fill="none" width="22" height="22">
              <path d="M3 3l18 18" stroke="#5a5a5a" stroke-width="2" stroke-linecap="round"/>
              <path d="M10.6 5.2C11 5.1 11.5 5 12 5c7 0 11 7 11 7-.6 1.1-1.6 2.5-3 3.7M6.6 6.6C4 8.3 2.3 10.7 1 12c0 0 4 7 11 7 1.4 0 2.6-.3 3.7-.7" stroke="#5a5a5a" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" class="login-btn">Login</button>

      <button type="button" class="forgot-link" (click)="onForgotPassword()">
        Forgot your password?
      </button>
    </form>
  </div>

  <div class="footer">
    <span>Don't have an account ?</span>
    <a href="javascript:void(0)" class="signup-link" (click)="onGoToSignUp()">Go to Sign up</a>
  </div>

</div>
